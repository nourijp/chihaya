# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site title
title: "Nouri Sensei"

# Site logo
logo:

# A description of your site for social meta tag, search engines, and feed.xml
description: "Nouri Sensei's website for Chihaya."

# Tagline below the site title
tagline: "Chihaya High's New ALT."

# The subpath of your site, e.g. /blog, for generating urls
baseurl: "/"

sass:
  sass_dir: _sass

# The base hostname & protocol of your site for where absolute urls are needed
url: "http://c.nouri.jp"

# Site navigation - each item must have a title and a url.
navigation:
- text: Home
  url: /
- text: About
  url: /about/
# - text: Style Guide
#   url: /style-guide/
- text: Archives
  url: /tags/

# The shortname for your Disqus site to enable comments.
disqus: chihaya

# Author information - author info at the bottom of the post
author_name: "Nouri"
author_bio: "A teacher, as well as a learner. Artist, and writer. Most importantly, a temporary being, seeking the infinite's proximity; thinking"
author_url: "http://nouri.jp"
author_location: "Tokyo, Japan"
author_image: authorimage.jpg

# Footer ad banner
banner_url: "https://nouri.jp"
banner_image: banner.jpg

# Footer newsletter widget - add your form action url for MailChimp signup form here
mailchimp_url: "//justgoodthemes.us3.list-manage.com/subscribe/post?u=78f1bab16028354caeb23aecd&amp;id=4a7330d117"

# Social links in the site footer
twitter_username: "nouri_jp"
facebook_username: "nourijp"
googleplus_username: "+nourijp"
github_username: "nourijp"
codepen_username: "username"
dribbble_username: "username"
medium_username: "@nourijp"
instagram_username: "nouri.jp"
pinterest_username: "nourijp"
linkedin_username: "nourijp"
deviantart_username: "nourijp"
twitter_username: "nouri_jp"

# http://jekyllrb.com/docs/pagination/
paginate: 5
paginate_path: '/blog/page:num/'
gems: [jekyll-paginate]

permalink: pretty
markdown: kramdown
kramdown:
    auto_ids: false
